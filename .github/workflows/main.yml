name: C# Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find .NET project
        id: find
        run: |
          FILE=$(find . -name "*.sln" -o -name "*.csproj" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "file=$FILE" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        if: steps.find.outputs.found == 'true'
        run: dotnet restore ${{ steps.find.outputs.file }}

      - name: Format
        if: steps.find.outputs.found == 'true'
        run: dotnet format ${{ steps.find.outputs.file }} --verify-no-changes
