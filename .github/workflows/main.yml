name: C# Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Optional but VERY useful for debugging CI issues
      - name: Show repository structure
        run: ls -R

      - name: Restore dependencies
        run: dotnet restore Weekly-Assignment-6.sln

      - name: Run dotnet format (verify only)
        run: dotnet format Weekly-Assignment-6.sln --verify-no-changes --verbosity diagnostic
